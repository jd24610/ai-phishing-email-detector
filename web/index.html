<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phishing Email Detector</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="data:,">
</head>
<body>
  <main>
    <header>
      <h1>Phishing Email Detector</h1>
      <p class="sub">Runs on your computer. Your email never leaves this machine.</p>
    </header>

    <label id="drop" class="drop" for="file">
      <input id="file" type="file" accept=".eml,message/rfc822">
      <strong>Drop an .eml file here</strong>
      <span>or click to choose one</span>
      <small>In Gmail: open the email, click the three dots, then "Download message".</small>
    </label>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <section id="result" hidden>
      <div id="verdict" class="verdict">
        <div>
          <p class="label">Verdict</p>
          <h2 id="verdict-text"></h2>
        </div>
        <div class="score">
          <span id="score-num"></span><small>/100</small>
        </div>
      </div>
      <div class="bar"><div id="bar-fill"></div></div>

      <dl class="meta">
        <dt>From</dt><dd id="from"></dd>
        <dt>Subject</dt><dd id="subject"></dd>
        <dt>Checks</dt><dd id="auth"></dd>
      </dl>

      <h3 id="reasons-title">Top reasons</h3>
      <ol id="reasons"></ol>

      <h3>What to do</h3>
      <p id="advice" class="advice"></p>

      <h3>All findings</h3>
      <div id="categories"></div>

      <h3>Limits of this check</h3>
      <ul id="notes" class="notes"></ul>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
