<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Phishing Email Detector</h1>

  <div class="row">
    <span>Detector</span>
    <span id="status" class="pill">Checking...</span>
  </div>
  <p id="help" class="help" hidden></p>

  <label class="row toggle">
    <span>Scan emails when I open them</span>
    <input id="auto" type="checkbox">
  </label>

  <details>
    <summary>Advanced</summary>
    <label class="row toggle">
      <span>Use local server instead<br><small>For development. Needs <code>python3 server.py</code>.</small></span>
      <input id="server" type="checkbox">
    </label>
  </details>

  <p class="foot">Everything runs on this computer. Emails are never sent online.</p>
  <script src="popup.js"></script>
</body>
</html>
